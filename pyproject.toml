[project]
name = "minimal-drift"
version = "0.1.0"
description = "Decision-boundary-aware, counterfactual, payment-valid red team for agentic payments (AP2)."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "scipy>=1.11",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
live = ["google-genai>=0.3"]
crypto = ["cryptography>=42"]
dev = ["pytest>=8", "ruff>=0.4", "black>=24", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
packages = ["minimal_drift"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"scripts/_gen_catalog.py" = ["E501"]  # long literal data rows read better unwrapped
